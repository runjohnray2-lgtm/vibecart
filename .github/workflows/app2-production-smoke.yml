name: App #2 Production Smoke

on:
  push:
    branches:
      - agent/app2-production-smoke

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund --legacy-peer-deps
      - run: npx playwright install --with-deps chromium
      - run: npx -y -p playwright node scripts/smoke-app2-production.mjs
