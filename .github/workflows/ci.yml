name: VibeCart CI

on:
  push:
    branches:
      - "agent/**"
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Start production server
        run: |
          npm start -- -p 3000 > /tmp/vibecart-next.log 2>&1 &
          echo $! > /tmp/vibecart-next.pid
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:3000/mcp > /tmp/vibecart-mcp.json; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/vibecart-next.log
          exit 1

      - name: Smoke test MCP commerce flow
        run: node scripts/smoke-mcp.mjs

      - name: Inspect MCP production transport
        run: npx --yes @modelcontextprotocol/inspector --cli http://127.0.0.1:3000/mcp --transport http --method tools/list

      - name: Show server log on failure
        if: failure()
        run: cat /tmp/vibecart-next.log || true
