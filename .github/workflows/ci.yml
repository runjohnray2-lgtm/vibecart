name: VibeCart CI

on:
  push:
    branches:
      - "agent/**"
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Checkout released UCP 2026-04-08 schemas
        uses: actions/checkout@v6
        with:
          repository: Universal-Commerce-Protocol/ucp
          ref: v2026-04-08
          path: .ucp-spec

      - name: Use Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: 20
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Start production server
        run: |
          npm start -- -p 3000 > /tmp/vibecart-next.log 2>&1 &
          echo $! > /tmp/vibecart-next.pid
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:3000/mcp > /tmp/vibecart-mcp.json; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/vibecart-next.log
          exit 1

      - name: Smoke test MCP commerce flow
        run: node scripts/smoke-mcp.mjs

      - name: Capture live UCP catalog payloads
        run: node scripts/smoke-ucp-schema.mjs

      - name: Generate UCP order through production mapper
        run: node scripts/smoke-ucp-order.mjs

      - name: Validate released UCP discovery profile
        run: |
          python -m pip install --disable-pip-version-check 'jsonschema>=4,<5'
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator, RefResolver

          root = Path('.ucp-spec').resolve()
          schemas_root = root / 'source/schemas'
          schema_path = root / 'source/discovery/profile_schema.json'
          schema = json.loads(schema_path.read_text())
          instance = json.loads(Path('/tmp/vibecart-ucp-payloads/discovery.json').read_text())

          store = {}
          for path in root.rglob('*.json'):
              try:
                  document = json.loads(path.read_text())
              except Exception:
                  continue
              store[path.resolve().as_uri()] = document
              if isinstance(document, dict) and isinstance(document.get('$id'), str):
                  store[document['$id']] = document
              if path.is_relative_to(schemas_root):
                  rel = path.relative_to(schemas_root).as_posix()
                  store[f'https://ucp.dev/schemas/{rel}'] = document
                  store[f'https://ucp.dev/schemas/schemas/{rel}'] = document

          # The released discovery file uses a repository-relative reference while
          # also declaring a public $id. Give the validator a local base URI so
          # every nested reference is resolved from the checked-out release tag.
          schema['$id'] = schema_path.resolve().as_uri()
          resolver = RefResolver(base_uri=schema_path.resolve().as_uri(), referrer=schema, store=store)
          Draft202012Validator(schema, resolver=resolver).validate(instance)
          print('UCP discovery profile validates against official v2026-04-08 profile_schema.json')
          PY

      - name: Install Rust toolchain for official UCP validator
        uses: dtolnay/rust-toolchain@stable

      - name: Build official UCP schema validator 1.4.1
        run: cargo install ucp-schema --version 1.4.1 --locked

      - name: Validate UCP 2026-04-08 commerce payloads
        run: |
          set -euo pipefail
          ucp-schema validate /tmp/vibecart-ucp-payloads/search.json --schema .ucp-spec/source/schemas/shopping/catalog_search.json --response --op search --def search_response --schema-local-base .ucp-spec/source/schemas --schema-remote-base https://ucp.dev/schemas --json
          ucp-schema validate /tmp/vibecart-ucp-payloads/lookup.json --schema .ucp-spec/source/schemas/shopping/catalog_lookup.json --response --op lookup --def lookup_response --schema-local-base .ucp-spec/source/schemas --schema-remote-base https://ucp.dev/schemas --json
          ucp-schema validate /tmp/vibecart-ucp-payloads/get-product.json --schema .ucp-spec/source/schemas/shopping/catalog_lookup.json --response --op get_product --def get_product_response --schema-local-base .ucp-spec/source/schemas --schema-remote-base https://ucp.dev/schemas --json
          ucp-schema validate /tmp/vibecart-ucp-payloads/order.json --schema .ucp-spec/source/schemas/shopping/order.json --response --op read --schema-local-base .ucp-spec/source/schemas --schema-remote-base https://ucp.dev/schemas --json
          ucp-schema validate /tmp/vibecart-ucp-payloads/order-not-found.json --schema .ucp-spec/source/schemas/shopping/order.json --response --op read --schema-local-base .ucp-spec/source/schemas --schema-remote-base https://ucp.dev/schemas --json
          ucp-schema validate /tmp/vibecart-ucp-payloads/order-unauthorized.json --schema .ucp-spec/source/schemas/shopping/order.json --response --op read --schema-local-base .ucp-spec/source/schemas --schema-remote-base https://ucp.dev/schemas --json
          ucp-schema validate /tmp/vibecart-ucp-payloads/order-unavailable.json --schema .ucp-spec/source/schemas/shopping/order.json --response --op read --schema-local-base .ucp-spec/source/schemas --schema-remote-base https://ucp.dev/schemas --json

      - name: Inspect MCP production transport
        run: npx --yes @modelcontextprotocol/inspector@latest --cli http://127.0.0.1:3000/mcp --transport http --method tools/list

      - name: Show server log on failure
        if: failure()
        run: cat /tmp/vibecart-next.log || true
